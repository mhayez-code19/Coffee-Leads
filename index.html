<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Shop Openings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
:root{
  --bg:#faf8f5;--panel:#fff;--ink:#1f1a17;--muted:#6f655e;--line:#e7e1da;
  --accent:#8a4b20;--accent-ink:#fff;--chip:#f1ebe4;--new:#1f7a4d;--new-bg:#e3f4ea;
  --hot:#b8461b;--warm:#c9852c;--cool:#8c8580;--row-hover:#f6f1ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171412;--panel:#1f1b18;--ink:#efe9e3;--muted:#a59a91;--line:#342e29;
  --accent:#d4894f;--accent-ink:#1a120c;--chip:#2b2521;--new:#6fd3a0;--new-bg:#183326;
  --hot:#f08a5d;--warm:#e3b25e;--cool:#8f8780;--row-hover:#26211d;}}
:root[data-theme="dark"]{
  --bg:#171412;--panel:#1f1b18;--ink:#efe9e3;--muted:#a59a91;--line:#342e29;
  --accent:#d4894f;--accent-ink:#1a120c;--chip:#2b2521;--new:#6fd3a0;--new-bg:#183326;
  --hot:#f08a5d;--warm:#e3b25e;--cool:#8f8780;--row-hover:#26211d;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{padding:20px 16px 8px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.controls-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input[type=search]{flex:1 1 220px;min-width:0}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.chk{display:flex;gap:5px;align-items:center;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
main{max-width:1400px;margin:0 auto;padding:8px 16px 40px}
.count{color:var(--muted);margin:6px 0 8px;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;background:var(--panel)}
th.sorted{color:var(--ink)}
th .arr{opacity:.6;margin-left:3px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row-hover)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.name{font-weight:600}
.alt{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:1px;font-weight:600}
.b-new{background:var(--new-bg);color:var(--new)}
.b-chain{background:var(--chip);color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;margin:1px 3px 1px 0;font-size:12px;white-space:nowrap}
.st{font-size:12px;padding:3px 6px}
.detail td{background:var(--row-hover);cursor:default}
.detail .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px}
.detail dt{color:var(--muted);font-size:12px}.detail dd{margin:0 0 4px}
.detail textarea{width:100%;min-height:54px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.m-only{display:none}
.more{display:block;margin:14px auto}
footer{max-width:1400px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
footer table{font-size:12px}
@media (max-width:760px){
  thead{display:none}
  .m-only{display:inline-block}
  .controls{position:static}
  tbody tr.lead td{grid-column:2}
  tbody tr.lead td.c-score{grid-column:1;grid-row:1 / span 4}
  table,tbody,tr,td{display:block;width:100%}
  table{border:0;background:transparent}
  tbody tr.lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  tbody tr.lead td{border:0;padding:0}
  tbody tr.lead td.c-hide{display:none}
  tbody tr.detail{border:1px solid var(--line);border-radius:10px;margin:-6px 0 8px}
  tbody tr.detail td{border:0}
  footer table, footer tbody, footer tr, footer td{display:revert}
}
</style>
</head>
<body>
<header>
  <h1>☕ Coffee shop openings</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="stats" id="stats"></div>
</header>
<div class="controls"><div class="controls-in">
  <input type="search" id="q" placeholder="Search name, address, city, zip…" autocomplete="off">
  <div class="seg" id="since" title="First seen by the daily job">
    <button data-v="1">New today</button><button data-v="7">7d</button><button data-v="30">30d</button><button data-v="0" class="on">All</button>
  </div>
  <select id="state"><option value="">All states</option></select>
  <select id="signal"><option value="">All signals</option></select>
  <select id="status"><option value="">Any status</option></select>
  <label class="chk"><input type="checkbox" id="hideChains" checked> Hide chains</label>
  <label class="chk">Min score <input type="number" id="minScore" value="0" min="0" max="100" step="5" style="width:64px"></label>
  <select id="sortSel" class="m-only" title="Sort">
    <option value="score:-1">Sort: score</option><option value="first_event_date:-1">Sort: newest event</option>
    <option value="first_seen:-1">Sort: newest found</option><option value="name:1">Sort: name</option><option value="city:1">Sort: city</option>
  </select>
  <button id="csv">Download CSV</button>
</div></div>
<main>
  <div class="count" id="count"></div>
  <table id="tbl"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  <button class="more" id="more" hidden>Show more</button>
</main>
<footer id="foot"></footer>
<script>
const SIGNALS = {
  pre_opening_inspection:"Pre-opening inspection", new_food_permit:"New food permit",
  plan_review:"Plan review", building_permit:"Building permit",
  new_business_license:"New business license", business_registration:"State registration",
  inspection:"First inspection"};
const STATUSES = ["new","researching","contacted","demo booked","won","not a fit"];
const COLUMNS = [
  {k:"score", t:"Score", num:true, cls:"c-score"},
  {k:"name", t:"Shop"},
  {k:"city", t:"Location"},
  {k:"phone", t:"Phone", cls:"c-hide"},
  {k:"first_event_date", t:"Event date", num:true},
  {k:"signals", t:"Signals", cls:"c-hide"},
  {k:"first_seen", t:"Found", num:true, cls:"c-hide"},
  {k:"status", t:"Status"},
];
const PAGE = 200;
let DATA = [], META = {}, view = [], shown = PAGE, open = null;
let sort = {k:"score", dir:-1};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Status + notes are kept in this browser only.
function store(){ try { return JSON.parse(localStorage.getItem("leadNotes")||"{}"); } catch { return {}; } }
let NOTES = store();
function saveNotes(){ try { localStorage.setItem("leadNotes", JSON.stringify(NOTES)); } catch {} }
const statusOf = l => (NOTES[l.lead_key]||{}).status || "new";
const notesOf = l => (NOTES[l.lead_key]||{}).notes || "";

function scoreColor(s){ return s>=80?"var(--hot)":s>=60?"var(--warm)":"var(--cool)"; }
function fmtPhone(p){ p=String(p||"").replace(/\D/g,""); if(p.length===11&&p[0]==="1")p=p.slice(1);
  return p.length===10?`(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`:p; }
function daysAgo(iso){ return (Date.now()-new Date(iso.length<=19?iso+"Z":iso))/864e5; }
const latestSeen = () => DATA.reduce((m,l)=>l.first_seen>m?l.first_seen:m,"");

function sinceCut(days){
  if(!days) return "";
  // "New today" = rows added by the latest daily run; Nd = first seen within N days of the latest run.
  const last = new Date((latestSeen()||"").slice(0,10)+"T00:00:00Z");
  if (days===1) return latestSeen().slice(0,10);
  return new Date(last - (days-1)*864e5).toISOString().slice(0,10);
}

function apply(){
  const q = $("q").value.trim().toLowerCase();
  const st = $("state").value, sig = $("signal").value, stat = $("status").value;
  const hide = $("hideChains").checked, min = +$("minScore").value||0;
  const days = +document.querySelector("#since .on").dataset.v;
  const cut = sinceCut(days);
  view = DATA.filter(l =>
    (!hide || !l.chain) && l.score>=min && (!st||l.state===st) &&
    (!sig||l.signals.includes(sig)) && (!stat||statusOf(l)===stat) &&
    (!cut || l.first_seen.slice(0,10)>=cut) &&
    (!q || l._hay.includes(q)));
  const k=sort.k, d=sort.dir;
  view.sort((a,b)=>{ let x=k==="status"?statusOf(a):a[k], y=k==="status"?statusOf(b):b[k];
    if(typeof x==="number"&&typeof y==="number") return (x-y)*d || (b.score-a.score);
    x=String(x||""); y=String(y||""); if(!x&&y) return 1; if(x&&!y) return -1;
    return x.localeCompare(y)*d || (b.score-a.score); });
  shown = PAGE; render();
}

function head(){
  $("head").innerHTML = COLUMNS.map(c=>`<th data-k="${c.k}" class="${sort.k===c.k?"sorted":""}">${c.t}${sort.k===c.k?`<span class="arr">${sort.dir>0?"▲":"▼"}</span>`:""}</th>`).join("");
}

function row(l){
  const isNew = l.first_seen.slice(0,10) >= latestSeen().slice(0,10) && daysAgo(latestSeen())<3 && DATA._multiDay;
  const sigs = l.signals.split(",").map(s=>`<span class="chip">${esc(SIGNALS[s]||s)}</span>`).join("");
  const opts = STATUSES.map(s=>`<option ${s===statusOf(l)?"selected":""}>${s}</option>`).join("");
  return `<tr class="lead" data-key="${l.lead_key}">
   <td class="c-score"><span class="score" style="background:${scoreColor(l.score)}">${l.score}</span></td>
   <td><span class="name">${esc(l.name)}</span>${isNew?'<span class="badge b-new">NEW</span>':""}${l.chain?`<span class="badge b-chain">${esc(l.chain)}</span>`:""}
     ${l.alt_names?`<div class="alt">${esc(l.alt_names.slice(0,90))}</div>`:""}</td>
   <td>${esc(l.address)}<div class="alt">${esc([l.city,l.state].filter(Boolean).join(", "))} ${esc(l.zip)}</div></td>
   <td class="num c-hide">${l.phone?`<a href="tel:${esc(l.phone)}" onclick="event.stopPropagation()">${esc(fmtPhone(l.phone))}</a>`:""}</td>
   <td class="num">${esc(l.first_event_date)}</td>
   <td class="c-hide">${sigs}</td>
   <td class="num c-hide">${esc(l.first_seen.slice(0,10))}</td>
   <td><select class="st" data-key="${l.lead_key}" onclick="event.stopPropagation()">${opts}</select></td>
  </tr>${open===l.lead_key?detail(l):""}`;
}

function detail(l){
  const addr = [l.address,l.city,l.state,l.zip].filter(Boolean).join(", ");
  const g = encodeURIComponent(`${l.name} ${addr}`);
  const srcs = l.sources.split(",").map(s=>{const m=META.sources?.[s]; return m?.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.jurisdiction)}</a>`:esc(s);}).join(", ");
  return `<tr class="detail"><td colspan="${COLUMNS.length}"><div class="grid">
    <dl><dt>Look it up</dt><dd><a href="https://www.google.com/search?q=${g}" target="_blank" rel="noopener">Google</a> ·
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">Maps</a> ·
      <a href="https://www.instagram.com/explore/search/keyword/?q=${encodeURIComponent(l.name)}" target="_blank" rel="noopener">Instagram</a></dd>
      <dt>Phone</dt><dd>${l.phone?`<a href="tel:${esc(l.phone)}">${esc(fmtPhone(l.phone))}</a>`:"—"}</dd>
      <dt>Match</dt><dd>${esc(l.match_level)} · ${l.record_count} record${l.record_count>1?"s":""}</dd></dl>
    <dl><dt>Signals</dt><dd>${l.signals.split(",").map(s=>esc(SIGNALS[s]||s)).join(", ")}</dd>
      <dt>Event types</dt><dd>${esc(l.event_types)||"—"}</dd>
      <dt>Dates</dt><dd>${esc(l.first_event_date)}${l.last_event_date!==l.first_event_date?" → "+esc(l.last_event_date):""} · found ${esc(l.first_seen.slice(0,10))}</dd>
      <dt>Source</dt><dd>${srcs}</dd></dl>
    <dl><dt>Notes (saved in this browser)</dt><dd><textarea data-key="${l.lead_key}" placeholder="Owner name, IG handle, opening date…">${esc(notesOf(l))}</textarea></dd></dl>
  </div></td></tr>`;
}

function render(){
  head();
  $("body").innerHTML = view.slice(0,shown).map(row).join("");
  $("more").hidden = shown>=view.length;
  $("more").textContent = `Show more (${(view.length-shown).toLocaleString()} left)`;
  $("count").textContent = `${view.length.toLocaleString()} of ${DATA.length.toLocaleString()} leads`;
}

function stats(){
  const ind = DATA.filter(l=>!l.chain);
  const ls = latestSeen().slice(0,10);
  const fresh = DATA._multiDay ? DATA.filter(l=>l.first_seen.slice(0,10)===ls).length : 0;
  const hot = ind.filter(l=>l.score>=80).length;
  const states = new Set(DATA.map(l=>l.state).filter(Boolean)).size;
  $("stats").innerHTML = [
    [ind.length.toLocaleString(),"independent leads"],[hot.toLocaleString(),"score 80+"],
    [fresh.toLocaleString(),"new in last run"],[states,"states"]]
    .map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  const when = META.last_run ? new Date(META.last_run+"Z") : null;
  $("sub").innerHTML = `New coffee shops from city and state permit, license and inspection data. Refreshed daily${when?` · last run ${when.toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}`:""}.`;
  const runs = (META.runs||[]).map(r=>`<tr><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.jurisdiction||r.source_id)}</a>`:esc(r.source_id)}</td><td class="num">${r.fetched??""}</td><td class="num">${r.matched??""}</td><td>${r.error?"⚠️ "+esc(r.error.slice(0,120)):"ok"}</td></tr>`).join("");
  $("foot").innerHTML = `<p><b>Last run by source</b></p><table><thead><tr><th>Source</th><th>Fetched</th><th>Coffee</th><th>Status</th></tr></thead><tbody>${runs}</tbody></table>
   <p>Score 0–100: how clearly it's coffee + how close to opening the signal is + recency, minus 45 for chains. Status and notes are stored in this browser only; use Download CSV to keep them.</p>`;
}

function fillSelect(id, values, label=v=>v){
  $(id).insertAdjacentHTML("beforeend", values.map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join(""));
}

function csv(){
  const cols=["score","name","alt_names","address","city","state","zip","phone","first_event_date","signals","sources","match_level","chain","first_seen"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[[...cols,"status","notes"].join(",")].concat(view.map(l=>[...cols.map(c=>q(l[c])),q(statusOf(l)),q(notesOf(l))].join(",")));
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));
  a.download=`coffee_leads_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

fetch("leads.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{
  META=j;
  DATA=j.rows.map(r=>{const o={}; j.cols.forEach((c,i)=>o[c]=r[i]); o.score=+o.score||0; o.record_count=+o.record_count||0;
    o._hay=[o.name,o.alt_names,o.address,o.city,o.state,o.zip,o.phone].join(" ").toLowerCase(); return o;});
  DATA._multiDay = new Set(DATA.map(l=>l.first_seen.slice(0,10))).size>1;
  fillSelect("state",[...new Set(DATA.map(l=>l.state).filter(Boolean))].sort());
  fillSelect("signal",Object.keys(SIGNALS).filter(s=>DATA.some(l=>l.signals.includes(s))),s=>SIGNALS[s]);
  fillSelect("status",STATUSES);
  stats(); apply();
}).catch(e=>{$("sub").textContent="Couldn't load leads.json: "+e;});

let t; $("q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(apply,120);});
["state","signal","status","hideChains","minScore"].forEach(id=>$(id).addEventListener("change",apply));
$("since").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#since button").forEach(x=>x.classList.toggle("on",x===b)); apply();});
$("head").addEventListener("click",e=>{const th=e.target.closest("th"); if(!th)return; const k=th.dataset.k;
  sort = sort.k===k?{k,dir:-sort.dir}:{k,dir:["name","city","status"].includes(k)?1:-1}; apply();});
$("body").addEventListener("click",e=>{const tr=e.target.closest("tr.lead"); if(!tr||e.target.closest("a,select,textarea"))return;
  open = open===tr.dataset.key?null:tr.dataset.key; render();});
$("body").addEventListener("change",e=>{const k=e.target.dataset.key; if(!k)return;
  if(e.target.matches("select.st")){(NOTES[k]=NOTES[k]||{}).status=e.target.value; saveNotes();}});
$("body").addEventListener("input",e=>{const k=e.target.dataset.key; if(k&&e.target.matches("textarea")){(NOTES[k]=NOTES[k]||{}).notes=e.target.value; saveNotes();}});
$("sortSel").addEventListener("change",e=>{const [k,d]=e.target.value.split(":"); sort={k,dir:+d}; apply();});
$("more").addEventListener("click",()=>{shown+=PAGE; render();});
$("csv").addEventListener("click",csv);
</script>
</body>
</html>
